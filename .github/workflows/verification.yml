name: Verification de mon site

'on':
  push:
    branches:
      - main

jobs:
  verification:
    name: Verifier le site
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers du projet
        uses: actions/checkout@v4

      - name: Verifier la presence de la page
        run: test -f index.html

      - name: Verifier le titre principal
        run: grep -q "<h1>" index.html

      - name: Verification terminee
        run: echo "Toutes les verifications sont reussies !"

      - name: Analyser la qualite du HTML
        run: npx --yes htmlhint index.html
